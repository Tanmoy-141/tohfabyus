name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  test-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Files
        run: ls

      - name: Check HTML
        run: |
          if [ -f index.html ]; then
            echo "HTML file exists"
          else
            echo "Missing index.html"
            exit 1
          fi

      - name: Check CSS
        run: |
          if [ -f style.css ]; then
            echo "CSS file exists"
          else
            echo "Missing style.css"
            exit 1
          fi

      - name: Pipeline Success
        run: echo "CI/CD working successfully!"
