name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test-project:
    runs-on: ubuntu-latest

    steps:
      # Clone repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Show project files
      - name: Show Files
        run: ls

      # Check HTML file
      - name: Check HTML
        run: |
          if [ -f index.html ]; then
            echo "HTML file exists"
          else
            echo "Missing index.html"
            exit 1
          fi

      # Check CSS file
      - name: Check CSS
        run: |
          if [ -f style.css ]; then
            echo "CSS file exists"
          else
            echo "Missing style.css"
            exit 1
          fi

      # Check JavaScript file
      - name: Check JavaScript
        run: |
          if [ -f script.js ]; then
            node --check script.js
            echo "JavaScript syntax valid"
          else
            echo "Missing script.js"
            exit 1
          fi

      # Final success message
      - name: Pipeline Success
        run: echo "GitHub CI/CD Pipeline completed successfully!"
